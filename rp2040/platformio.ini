; HealthyPi 5 - RP2040 sensor firmware (PlatformIO)
; Base: Earle Philhower core (build/upload/USB glue) but all our code uses the
; raw pico-sdk (hardware/spi.h, hardware/i2c.h, hardware/uart.h, hardware/gpio.h)
; - no SPI.h / Wire.h / Serial / Arduino sensor libraries.
;
; The maxgerhardt platform fork provides the Philhower ("earlephilhower") core.

[env:healthypi5_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; 2 MB flash, no filesystem (matches your Arduino IDE selection)
board_build.filesystem_size = 0m
board_build.f_cpu = 133000000L

build_flags =
    -O2
    -Wall

; UF2 upload by default (drag-drop or auto). Set a COM port if you use serial.
; upload_port = COMx
monitor_speed = 115200
