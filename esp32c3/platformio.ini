; HealthyPi 5 - ESP32-C3 BLE gateway (PlatformIO / ESP-IDF)
; PlatformIO manages its own ESP-IDF (framework = espidf). NimBLE comes from the
; IDF "bt" component and is enabled via sdkconfig.defaults (added at milestone 2).

[env:healthypi5_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200

; If your C3 module has a different flash size, adjust here.
board_upload.flash_size = 4MB
