<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NirogScan Live</title>
<style>
  :root{
    --bg:#1a1a1a; --panel:#252525; --border:#333; --muted:#777; --text:#ccc;
    --green:#00ff88; --red:#ff6666; --cyan:#66ffff; --ok:#4f4; --warn:#fa0; --bad:#f44;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;
         background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
  header .grow{flex:1}
  button{background:#333;color:var(--text);border:1px solid #444;border-radius:6px;
         padding:8px 14px;font-weight:700;cursor:pointer}
  button:hover:not(:disabled){background:#444}
  button:disabled{opacity:.45;cursor:default}
  #status{font-size:12px;color:var(--muted)}
  main{flex:1;display:flex;min-height:0}
  #plots{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px;min-width:0}
  .plot{flex:1;position:relative;background:#111;border:1px solid var(--border);border-radius:6px;min-height:0}
  .plot canvas{display:block;width:100%;height:100%}
  .plot .lbl{position:absolute;top:6px;left:10px;font-size:11px;color:var(--muted);
             text-transform:uppercase;letter-spacing:1px}
  #side{width:250px;flex-shrink:0;padding:8px 8px 8px 0;display:flex;flex-direction:column;gap:8px;overflow:auto}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:8px;
        padding:8px 6px;text-align:center}
  .tile .t{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .tile .v{font-size:26px;font-weight:800;color:var(--ok);line-height:1.2}
  .tile .u{font-size:10px;color:var(--muted)}
  .bar{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
       display:flex;align-items:center;gap:8px;font-size:12px}
  .bar .fill{flex:1;height:8px;background:#333;border-radius:4px;overflow:hidden}
  .bar .fill i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
  .note{font-size:11px;color:var(--muted);line-height:1.4;padding:2px 2px}
  .note code{color:#9cf}
</style>
</head>
<body>
<header>
  <h1>NirogScan&nbsp;Live</h1>
  <span id="status">Idle</span>
  <span class="grow"></span>
  <button id="rec" disabled>Record</button>
  <button id="conn">Connect</button>
</header>

<main>
  <div id="plots">
    <div class="plot"><span class="lbl">ECG · 128 Hz</span><canvas id="cEcg"></canvas></div>
    <div class="plot"><span class="lbl">Respiration · BioZ</span><canvas id="cResp"></canvas></div>
    <div class="plot"><span class="lbl">PPG · 64 Hz</span><canvas id="cPpg"></canvas></div>
  </div>
  <div id="side">
    <div class="grid">
      <div class="tile"><div class="t">HR</div><div class="v" id="vHr">--</div><div class="u">bpm</div></div>
      <div class="tile"><div class="t">SpO₂</div><div class="v" id="vSpo2">--</div><div class="u">%</div></div>
      <div class="tile"><div class="t">Temp</div><div class="v" id="vTemp">--</div><div class="u">°C</div></div>
      <div class="tile"><div class="t">Resp</div><div class="v" id="vRr">--</div><div class="u">/min</div></div>
    </div>
    <div class="bar">Battery <div class="fill"><i id="batFill"></i></div><span id="batTxt">--%</span></div>
    <div class="note">
      Chrome or Edge required (Web Bluetooth). Serve over HTTPS (GitHub Pages)
      or <code>localhost</code>. Click <b>Connect</b> and pick
      <code>HealthyPi5</code>.
    </div>
  </div>
</main>

<script>
"use strict";

// ---- BLE contract (matches the NirogScan firmware / Y3X app) ----------------
const SVC_ECG = "00001122-0000-1000-8000-00805f9b34fb";
const CHR_ECG = "00001424-0000-1000-8000-00805f9b34fb";
const CHR_RESP= "babe4a4c-7789-11ed-a1eb-0242ac120002";
const SVC_HRV = "cd5c7491-4448-7db8-ae4c-d1da8cba36d0";
const CHR_RR  = "cd5ca86f-4448-7db8-ae4c-d1da8cba36d0";
const CHR_PPG = "cd5c1525-4448-7db8-ae4c-d1da8cba36d0";

// ---- rolling buffers --------------------------------------------------------
const ECG_N = 640, RESP_N = 320, PPG_N = 320;
const ecg = [], resp = [], ppg = [];
function push(buf, v, n){ buf.push(v); if (buf.length > n) buf.splice(0, buf.length - n); }

let hr = null, spo2 = null, temp = null, rr = null, bat = null;

// ---- recording (CSV) --------------------------------------------------------
let recording = false;
let recEcg = [], recPpg = [], recResp = [];

// ---- element refs -----------------------------------------------------------
const $ = id => document.getElementById(id);
const statusEl = $("status");
function setStatus(t, c){ statusEl.textContent = t; statusEl.style.color = c || "var(--muted)"; }

// ---- notification handlers (parse exactly like the firmware emits) ----------
function onEcg(dv){ for(let i=0;i+4<=dv.byteLength;i+=4){ const s=dv.getInt32(i,true); push(ecg,s,ECG_N); if(recording) recEcg.push(s);} }
function onResp(dv){ for(let i=0;i+4<=dv.byteLength;i+=4){ const s=dv.getInt32(i,true); push(resp,s,RESP_N); if(recording) recResp.push(s);} }
function onPpg(dv){ if(dv.byteLength>=2){ const s=dv.getInt16(0,true); push(ppg,s,PPG_N); if(recording) recPpg.push(s);} }
function onRr(dv){ if(dv.byteLength>=2){ rr=dv.getUint16(0,true); setTile("vRr",rr,rr<12||rr>20?"var(--warn)":"var(--ok)"); } }
function onHr(dv){ if(dv.byteLength>=2){ const f=dv.getUint8(0); hr=(f&1)?dv.getUint16(1,true):dv.getUint8(1);
                    setTile("vHr",hr,hr<60?"var(--warn)":hr>100?"var(--bad)":"var(--ok)"); } }
function onSpo2(dv){ if(dv.byteLength>=3){ spo2=dv.getUint16(1,true); setTile("vSpo2",spo2,spo2<95?"var(--bad)":"var(--ok)"); } }
function onTemp(dv){ if(dv.byteLength>=2){ temp=dv.getUint16(0,true)/100; setTile("vTemp",temp.toFixed(1),temp>37.5?"var(--bad)":temp<36?"var(--warn)":"var(--ok)"); } }
function onBat(dv){ if(dv.byteLength>=1){ bat=dv.getUint8(0); $("batFill").style.width=bat+"%";
                    $("batFill").style.background=bat<=20?"var(--bad)":bat<=50?"var(--warn)":"var(--ok)"; $("batTxt").textContent=bat+"%"; } }

function setTile(id,val,color){ const e=$(id); e.textContent=val; if(color) e.style.color=color; }

// standard 16-bit services/chars
const SUBS = [
  [0x180D, 0x2A37, onHr],
  [0x1822, 0x2A5E, onSpo2],
  [0x1809, 0x2A6E, onTemp],
  [0x180F, 0x2A19, onBat],
  [SVC_ECG, CHR_ECG, onEcg],
  [SVC_ECG, CHR_RESP, onResp],
  [SVC_HRV, CHR_RR, onRr],
  [SVC_HRV, CHR_PPG, onPpg],
];

// ---- connection -------------------------------------------------------------
let device = null;

async function connect(){
  if(!navigator.bluetooth){ setStatus("Web Bluetooth not available (use Chrome/Edge)", "var(--bad)"); return; }
  try{
    setStatus("Requesting device…", "var(--warn)");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "HealthyPi5" }],
      optionalServices: [0x180D, 0x1822, 0x1809, 0x180F, SVC_ECG, SVC_HRV]
    });
    device.addEventListener("gattserverdisconnected", onDisconnect);
    setStatus("Connecting…", "var(--warn)");
    const server = await device.gatt.connect();

    // cache services, then subscribe to each characteristic (tolerant)
    const svcCache = {};
    let ok = 0;
    for(const [svc, chr, cb] of SUBS){
      try{
        if(!svcCache[svc]) svcCache[svc] = await server.getPrimaryService(svc);
        const c = await svcCache[svc].getCharacteristic(chr);
        await c.startNotifications();
        c.addEventListener("characteristicvaluechanged", e => cb(e.target.value));
        ok++;
      }catch(err){ /* characteristic not present / not notifiable — skip */ }
    }
    setStatus("Connected ("+ok+"/"+SUBS.length+" streams)", "var(--ok)");
    $("conn").textContent = "Disconnect";
    $("rec").disabled = false;
  }catch(err){
    setStatus("Error: " + (err.message || err), "var(--bad)");
  }
}

function onDisconnect(){
  setStatus("Disconnected", "var(--muted)");
  $("conn").textContent = "Connect";
  $("rec").disabled = true;
  if(recording) toggleRecord();
}

function disconnect(){ if(device && device.gatt.connected) device.gatt.disconnect(); }

$("conn").addEventListener("click", () => {
  if(device && device.gatt.connected) disconnect(); else connect();
});

// ---- recording --------------------------------------------------------------
function toggleRecord(){
  recording = !recording;
  $("rec").textContent = recording ? "Stop & Save" : "Record";
  $("rec").style.color = recording ? "var(--bad)" : "";
  if(recording){ recEcg=[]; recPpg=[]; recResp=[]; }
  else { downloadCsv("ecg", recEcg); downloadCsv("ppg", recPpg); downloadCsv("bioz", recResp); }
}
function downloadCsv(name, arr){
  if(!arr.length) return;
  let s = "Index,Data\n";
  for(let i=0;i<arr.length;i++) s += i + "," + arr[i] + "\n";
  const blob = new Blob([s], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nirogscan_" + name + "_" + Date.now() + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
$("rec").addEventListener("click", toggleRecord);

// ---- rendering (autoscaled rolling waveforms) -------------------------------
function draw(cv, buf, color){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  // grid
  ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=0;x<=w;x+=w/8){ ctx.moveTo(x,0); ctx.lineTo(x,h); }
  for(let y=0;y<=h;y+=h/4){ ctx.moveTo(0,y); ctx.lineTo(w,y); }
  ctx.stroke();

  const n = buf.length;
  if(n < 2) return;
  let mn=Infinity, mx=-Infinity;
  for(let i=0;i<n;i++){ const v=buf[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
  let rng = mx-mn; if(rng===0) rng=1; const pad = rng*0.1; mn-=pad; mx+=pad; rng=mx-mn;

  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.beginPath();
  for(let i=0;i<n;i++){
    const x = (i/(n-1))*w;
    const y = h - ((buf[i]-mn)/rng)*h;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.stroke();
}
function loop(){
  draw($("cEcg"),  ecg,  "#00ff88");
  draw($("cResp"), resp, "#ff6666");
  draw($("cPpg"),  ppg,  "#66ffff");
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if(!navigator.bluetooth) setStatus("Web Bluetooth unavailable — use Chrome/Edge over HTTPS", "var(--bad)");
</script>
</body>
</html>
